[workflow]

activation_steps_prepend = [
  "Sync with main before anything else: run `git fetch origin`, then bring the current branch up to date with `origin/main`. In a worktree the Claude desktop app made for this session, call the ccd_host `sync_with_base_branch` tool (base `main`) instead of merging yourself; otherwise fast-forward or merge `origin/main` with git. If the main checkout has `main` checked out and clean, also fast-forward it (`git -C <main checkout> merge --ff-only origin/main`); if it is on another branch, `git fetch origin main:main` updates the local `main` ref when that is a fast-forward. If the working tree is dirty, the merge conflicts, or a fast-forward is impossible, HALT and ask the user. Report which new commits came in, and treat merged stories as current state for the rest of the run (for example a dependency story that is now done).",
]

persistent_facts = [
  "Sprint status on PR: step 05 sets the story to `review` in sprint-status.yaml. When the user approves the changes and asks to raise or create a pull request, first set that story's `development_status` entry to `done` in `{implementation_artifacts}/sprint-status.yaml` (update `last_updated`, preserve comments and structure), commit it on the story branch, then push and open the PR. Merging the PR is what makes `done` true on main; a PR closed without merging never lands it. Do not mark the parent epic `done` unless every story in that epic is `done`.",
  "Deferred-work status: every entry in `{implementation_artifacts}/deferred-work.md` has a `status:` line directly under `source_spec:`, either `open` or `resolved-by <ref>`. New entries start as `status: open`. At story close-out, right after opening the PR, set the status of every existing entry the story resolves to `resolved-by #<PR number>` with a few words on how, then commit and push that change on the story branch. Use the PR number, not a branch commit, because PRs are squash-merged and branch commits never reach main. This is the one permitted edit to existing entries.",
]
