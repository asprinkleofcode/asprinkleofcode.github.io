[workflow]

persistent_facts = [
  "Sprint status on PR: step 05 sets the story to `review` in sprint-status.yaml. When the user approves the changes and asks to raise or create a pull request, first set that story's `development_status` entry to `done` in `{implementation_artifacts}/sprint-status.yaml` (update `last_updated`, preserve comments and structure), commit it on the story branch, then push and open the PR. Merging the PR is what makes `done` true on main; a PR closed without merging never lands it. Do not mark the parent epic `done` unless every story in that epic is `done`.",
  "Deferred-work status: every entry in `{implementation_artifacts}/deferred-work.md` has a `status:` line directly under `source_spec:`, either `open` or `resolved-by <ref>`. New entries start as `status: open`. At story close-out, in the same commit that marks the story `done`, set the status of every existing entry the story resolves to `resolved-by #<PR number>` with a few words on how. Use the PR number, not a branch commit, because PRs are squash-merged and branch commits never reach main. This is the one permitted edit to existing entries.",
]
